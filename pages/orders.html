<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | RS Hobby Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <img src="../images/logos/logo.png" alt="RS Hobby Shop">
        </div>
        <div class="menu-label">MAIN</div>
        <nav>
            <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="collection.html"><i class="fa-solid fa-folder"></i> My Collection</a>
            <a href="marketplace.html"><i class="fa-solid fa-store"></i> Marketplace</a>
            <a href="myshop.html"><i class="fa-solid fa-shop"></i> My Shop</a>
            <a href="auctions.html"><i class="fa-solid fa-gavel"></i> Auctions</a>
            <a href="wishlist.html"><i class="fa-solid fa-heart"></i> Wishlist</a>
            <a class="active" href="orders.html"><i class="fa-solid fa-box"></i> Orders</a>
            <a href="settings.html"><i class="fa-solid fa-cog"></i> Settings</a>
            <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
        </nav>
    </aside>
    <main class="main-content">
        <div class="topbar mb-4">
            <div>
                <h2>📦 Orders</h2>
                <p class="text-muted mb-0">Track each sale from payment through delivery.</p>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card shadow-sm bg-dark border-secondary">
                    <div class="card-body text-center">
                        <h6>Pending</h6>
                        <h2 id="ordersPendingCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm bg-dark border-secondary">
                    <div class="card-body text-center">
                        <h6>Paid</h6>
                        <h2 id="ordersPaidCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm bg-dark border-secondary">
                    <div class="card-body text-center">
                        <h6>Shipped</h6>
                        <h2 id="ordersShippedCount">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm bg-dark border-secondary">
                    <div class="card-body text-center">
                        <h6>Delivered</h6>
                        <h2 id="ordersDeliveredCount">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <input id="ordersSearch" class="form-control" placeholder="Search Player, Brand, Set or Status">
            </div>
            <div class="col-md-3">
                <select id="ordersStatusFilter" class="form-select">
                    <option value="all">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Paid">Paid</option>
                    <option value="Packing">Packing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="ordersSortOrder" class="form-select">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="priceAsc">Price Low → High</option>
                    <option value="priceDesc">Price High → Low</option>
                </select>
            </div>
            <div class="col-md-2">
                <button id="ordersClearFilters" class="btn btn-outline-light w-100">Clear Filters</button>
            </div>
        </div>

        <div class="card bg-dark border-secondary mt-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Player</th>
                                <th>Brand</th>
                                <th>Set</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable"></tbody>
                    </table>
                </div>
                <div id="ordersEmpty" class="text-center text-muted py-4" style="display:none;">No orders yet.</div>
            </div>
        </div>
    </main>
</div>
<script src="../js/storage.js"></script>
<script src="../js/orders.js"></script>
</body>
</html>
