<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RS Hobby Shop</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- SIDEBAR                   -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="logo text-center">

            <img src="images/logos/logo.png" alt="RS Hobby Shop">

        </div>

        <div class="menu-label">
            MAIN
        </div>

        <nav>

            <a class="active" href="#">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>

            <a href="pages/collection.html">
                <i class="fa-solid fa-folder"></i>
                <span>My Collection</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-store"></i>
                <span>Marketplace</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-shop"></i>
                <span>My Shop</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-gavel"></i>
                <span>Auctions</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-heart"></i>
                <span>Wishlist</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-box"></i>
                <span>Orders</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-chart-line"></i>
                <span>Analytics</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>

        </nav>

        <div class="profile">

            <div class="profile-avatar">
                RJ
            </div>

            <div>

                <h6>RJ Marcelo</h6>

                <small>Collector & Seller</small>

            </div>

        </div>

    </aside>

    <!-- ========================= -->
    <!-- MAIN CONTENT              -->
    <!-- ========================= -->

    <main class="main-content">

        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <h2>Good Afternoon, RJ 👋</h2>

                <p>Welcome back to RS Hobby Shop</p>

            </div>

            <div class="top-right">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        placeholder="Search cards, players, sets...">

                </div>

                <button class="notify">

                    <i class="fa-solid fa-bell"></i>

                </button>

            </div>

        </header>

        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="row g-4">

                <div class="col-lg-3">

                    <div class="stat-card">

                        <h5>Portfolio Value</h5>

                        <h2>₱0.00</h2>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="stat-card">

                        <h5>Total Cards</h5>

                        <h2>0</h2>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="stat-card">

                        <h5>For Sale</h5>

                        <h2>0</h2>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="stat-card">

                        <h5>Auctions</h5>

                        <h2>0</h2>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

</body>

</html>
